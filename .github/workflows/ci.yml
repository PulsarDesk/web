name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: svelte-check + unit + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: svelte-check
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Build (Worker output)
        run: bun run build
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: bun audit

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: e2e tests
        run: bun run test:e2e
